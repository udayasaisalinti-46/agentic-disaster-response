services:
  - type: web
    name: resqai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: resqai-db
          property: connectionString

databases:
  - name: resqai-db
    plan: free
    databaseName: disaster_response
    user: postgres
