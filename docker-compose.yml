version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: resqai_db
    environment:
      POSTGRES_USER: resqai_user
      POSTGRES_PASSWORD: resqai_password
      POSTGRES_DB: resqai_disaster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqai_user -d resqai_disaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resqai_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://resqai_user:resqai_password@db:5432/resqai_disaster
      ENVIRONMENT: production
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: resqai_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
